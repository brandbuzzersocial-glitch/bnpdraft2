<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOH Magazine — The Brand Edit Issue | BNP Interiors</title>
  <meta name="description" content="Read the exclusive SOH Magazine editorial feature on Punamchand D. Kularia and BNP Interiors. Interactive digital flipbook.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --color-primary: #caa05c;
      --color-primary-dk: #936e2e;
      --color-bg-dark: #090b10;
      --color-card-dark: #121620;
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Golos Text', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--color-bg-dark);
      color: #f0f2f5;
      font-family: var(--font-body);
      user-select: none;
      -webkit-user-select: none;
    }

    /* Top Bar */
    .viewer-topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: linear-gradient(180deg, rgba(9, 11, 16, 0.95) 0%, rgba(9, 11, 16, 0.6) 70%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 50;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(202, 160, 92, 0.12);
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .back-btn:hover {
      background: rgba(202, 160, 92, 0.18);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .doc-title-wrap h1 {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.3px;
    }
    .doc-title-wrap p {
      font-size: 0.74rem;
      color: #9aa3b2;
      margin-top: 1px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .zoom-controls-wrap {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 4px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    .zoom-badge {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--color-primary);
      padding: 0 4px;
      min-width: 44px;
      text-align: center;
      letter-spacing: 0.5px;
      user-select: none;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e1e6f0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      background: rgba(202, 160, 92, 0.2);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .icon-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.05);
    }

    /* Flipbook Stage Area */
    .viewer-stage {
      position: absolute;
      top: 64px;
      bottom: 68px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #171d2b 0%, #090b10 85%);
      overflow: hidden;
      padding: 15px;
    }

    .stage-zoom-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      transition: transform 0.28s cubic-bezier(0.2, 0, 0.2, 1);
      will-change: transform;
    }
    .stage-zoom-container.zoomed {
      cursor: grab;
    }
    .stage-zoom-container.panning {
      cursor: grabbing;
      transition: none;
    }

    .flipbook-render-target {
      position: relative;
      border-radius: 4px;
      transition: transform 0.45s cubic-bezier(0.2, 0, 0.2, 1);
      filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.65));
    }

    /* Floating Arrow Navigation */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(18, 22, 32, 0.82);
      border: 1px solid rgba(202, 160, 92, 0.35);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.15rem;
      z-index: 40;
      transition: all 0.25s cubic-bezier(0.2, 0, 0.2, 1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .nav-arrow:hover {
      background: rgba(202, 160, 92, 0.25);
      border-color: var(--color-primary);
      color: var(--color-primary);
      transform: translateY(-50%) scale(1.08);
    }
    .nav-arrow.prev { left: 24px; }
    .nav-arrow.next { right: 24px; }
    .nav-arrow.disabled {
      opacity: 0.25;
      pointer-events: none;
    }

    /* Bottom Control Bar */
    .viewer-bottombar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: linear-gradient(0deg, rgba(9, 11, 16, 0.98) 0%, rgba(9, 11, 16, 0.8) 75%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 0 24px;
      z-index: 50;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid rgba(202, 160, 92, 0.12);
    }
    .page-indicator {
      font-size: 0.86rem;
      font-weight: 600;
      color: #ffffff;
      min-width: 90px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .page-indicator span {
      color: var(--color-primary);
      font-weight: 700;
    }
    .scrubber-wrap {
      display: flex;
      align-items: center;
      width: 280px;
      max-width: 35vw;
    }
    .scrubber {
      width: 100%;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.18);
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--color-primary);
      box-shadow: 0 0 8px rgba(202, 160, 92, 0.6);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .scrubber::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }
    .controls-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Thumbnail Drawer */
    .thumb-drawer {
      position: absolute;
      bottom: 68px;
      left: 0;
      right: 0;
      height: 140px;
      background: rgba(14, 18, 26, 0.96);
      border-top: 1px solid rgba(202, 160, 92, 0.3);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 24px;
      overflow-x: auto;
      z-index: 60;
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.2, 0, 0.2, 1);
    }
    .thumb-drawer.open {
      transform: translateY(0);
    }
    .thumb-item {
      flex-shrink: 0;
      height: 100%;
      aspect-ratio: 0.77;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      position: relative;
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-item:hover {
      border-color: rgba(202, 160, 92, 0.6);
      transform: scale(1.05);
    }
    .thumb-item.active {
      border-color: var(--color-primary);
      box-shadow: 0 0 12px rgba(202, 160, 92, 0.4);
    }
    .thumb-item .thumb-num {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 0.65rem;
      padding: 1px 4px;
      border-radius: 2px;
    }

    /* Loading Spinner */
    .loader-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--color-bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.4s ease;
    }
    .loader-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(202, 160, 92, 0.15);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      margin-top: 14px;
      font-size: 0.88rem;
      color: #9ea8b8;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .viewer-topbar { padding: 0 12px; }
      .doc-title-wrap h1 { font-size: 0.85rem; }
      .doc-title-wrap p { display: none; }
      .scrubber-wrap { display: none; }
      .nav-arrow.prev { left: 8px; width: 42px; height: 42px; font-size: 1rem; }
      .nav-arrow.next { right: 8px; width: 42px; height: 42px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div class="loader-overlay" id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Loading SOH Magazine...</div>
  </div>

  <!-- Top Bar -->
  <header class="viewer-topbar">
    <div class="topbar-left">
      <a href="founder.html#soh-magazine-feature" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Article</span>
      </a>
      <div class="doc-title-wrap">
        <h1>SOH Magazine — The Brand Edit Issue</h1>
        <p>Punamchand D. Kularia &amp; BNP Interiors Special Edition</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="zoom-controls-wrap">
        <button class="icon-btn" id="btn-zoom-out" title="Zoom Out" aria-label="Zoom Out">
          <i class="fas fa-search-minus"></i>
        </button>
        <span class="zoom-badge" id="zoom-badge" title="Current Zoom">100%</span>
        <button class="icon-btn" id="btn-zoom-in" title="Zoom In" aria-label="Zoom In">
          <i class="fas fa-search-plus"></i>
        </button>
        <button class="icon-btn" id="btn-zoom-reset" title="Reset Zoom" aria-label="Reset Zoom" style="display: none;">
          <i class="fas fa-compress-arrows-alt"></i>
        </button>
      </div>
      <button class="icon-btn" id="btn-sound" title="Toggle Page Flip Sound">
        <i class="fas fa-volume-up"></i>
      </button>
      <button class="icon-btn" id="btn-thumbs" title="View Page Thumbnails">
        <i class="fas fa-th"></i>
      </button>
      <button class="icon-btn" id="btn-fullscreen" title="Toggle Fullscreen">
        <i class="fas fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- Stage Area -->
  <main class="viewer-stage" id="stage">
    <button class="nav-arrow prev" id="arrow-prev" title="Previous Page" aria-label="Previous Page">
      <i class="fas fa-chevron-left"></i>
    </button>

    <div class="stage-zoom-container" id="zoom-container">
      <div id="flipbook-book" class="flipbook-render-target"></div>
    </div>

    <button class="nav-arrow next" id="arrow-next" title="Next Page" aria-label="Next Page">
      <i class="fas fa-chevron-right"></i>
    </button>
  </main>

  <!-- Thumbnail Strip Drawer -->
  <div class="thumb-drawer" id="thumb-drawer"></div>

  <!-- Bottom Control Bar -->
  <footer class="viewer-bottombar">
    <div class="controls-cluster">
      <button class="icon-btn" id="btn-first" title="First Page"><i class="fas fa-step-backward"></i></button>
      <button class="icon-btn" id="btn-prev" title="Previous Page"><i class="fas fa-chevron-left"></i></button>
    </div>

    <div class="page-indicator">
      Page <span id="page-num">1</span> of 32
    </div>

    <div class="scrubber-wrap">
      <input type="range" class="scrubber" id="scrubber" min="1" max="32" value="1" step="1">
    </div>

    <div class="controls-cluster">
      <button class="icon-btn" id="btn-next" title="Next Page"><i class="fas fa-chevron-right"></i></button>
      <button class="icon-btn" id="btn-last" title="Last Page"><i class="fas fa-step-forward"></i></button>
    </div>
  </footer>

  <script src="assets/js/page-flip.browser.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const TOTAL_PAGES = 32;
      const pages = [];
      for (let i = 1; i <= TOTAL_PAGES; i++) {
        const num = String(i).padStart(2, '0');
        pages.push(`assets/images/soh/magazine/page_${num}.jpg`);
      }

      // Build Thumbnails
      const thumbDrawer = document.getElementById('thumb-drawer');
      pages.forEach((src, idx) => {
        const item = document.createElement('div');
        item.className = 'thumb-item' + (idx === 0 ? ' active' : '');
        item.dataset.index = idx;
        item.innerHTML = `<img src="${src}" alt="Page ${idx+1}" loading="lazy"><span class="thumb-num">${idx+1}</span>`;
        item.addEventListener('click', () => {
          if (pageFlip) {
            pageFlip.flip(idx);
            thumbDrawer.classList.remove('open');
          }
        });
        thumbDrawer.appendChild(item);
      });

      // Sound Effect using Web Audio API
      let soundEnabled = true;
      function playFlipSound() {
        if (!soundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const bufferSize = ctx.sampleRate * 0.12;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(900, ctx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(250, ctx.currentTime + 0.12);
          filter.Q.value = 1.1;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.09, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start();
        } catch (e) {}
      }

      // Calculate Stage Sizing
      const stage = document.getElementById('stage');
      const bookEl = document.getElementById('flipbook-book');
      const zoomContainer = document.getElementById('zoom-container');
      
      function getStageDimensions() {
        const isMobile = window.innerWidth <= 768;
        const stageW = stage.clientWidth - (isMobile ? 24 : 60);
        const stageH = stage.clientHeight - (isMobile ? 16 : 24);
        
        let baseW, baseH;
        if (isMobile) {
          // Single page portrait
          baseH = Math.min(stageH, 840);
          baseW = baseH * (2314 / 2995);
          if (baseW > stageW) {
            baseW = stageW;
            baseH = baseW / (2314 / 2995);
          }
        } else {
          // Double page spread
          baseH = Math.min(stageH, 960);
          let totalW = baseH * (2314 / 2995) * 2;
          if (totalW > stageW) {
            totalW = stageW;
            baseH = (totalW / 2) / (2314 / 2995);
          }
          baseW = totalW / 2;
        }
        return { width: Math.round(baseW), height: Math.round(baseH) };
      }

      const dims = getStageDimensions();

      // Initialize PageFlip
      const pageFlip = new St.PageFlip(bookEl, {
        width: dims.width,
        height: dims.height,
        size: 'stretch',
        minWidth: 260,
        maxWidth: 1200,
        minHeight: 340,
        maxHeight: 1400,
        maxShadowOpacity: 0.6,
        showCover: true,
        mobileScrollSupport: false,
        drawShadow: true,
        flippingTime: 750,
        usePortrait: true,
        startPage: 0,
        showPageCorners: true,
        disableFlipByClick: false,
        useMouseEvents: true
      });
      window.pageFlip = pageFlip;

      pageFlip.loadFromImages(pages);

      // DOM Elements
      const pageNumEl = document.getElementById('page-num');
      const scrubber = document.getElementById('scrubber');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const arrowPrev = document.getElementById('arrow-prev');
      const arrowNext = document.getElementById('arrow-next');
      const btnFirst = document.getElementById('btn-first');
      const btnLast = document.getElementById('btn-last');
      const btnSound = document.getElementById('btn-sound');
      const btnThumbs = document.getElementById('btn-thumbs');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const btnZoomIn = document.getElementById('btn-zoom-in');
      const btnZoomOut = document.getElementById('btn-zoom-out');
      const btnZoomReset = document.getElementById('btn-zoom-reset');
      const zoomBadge = document.getElementById('zoom-badge');
      const loader = document.getElementById('loader');

      // Zoom & Pan System
      let zoomLevel = 1;
      let panX = 0, panY = 0;
      let isPanning = false;
      let dragStartX = 0, dragStartY = 0;
      let panStartX = 0, panStartY = 0;

      function clampPan() {
        if (zoomLevel <= 1) {
          panX = 0;
          panY = 0;
          return;
        }
        const maxPanX = (stage.clientWidth * (zoomLevel - 1)) / (2 * zoomLevel) + 60;
        const maxPanY = (stage.clientHeight * (zoomLevel - 1)) / (2 * zoomLevel) + 40;
        panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
        panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
      }

      function updateZoomUI(instant = false) {
        if (instant) {
          zoomContainer.classList.add('panning');
        } else {
          zoomContainer.classList.remove('panning');
        }
        zoomContainer.style.transform = `scale(${zoomLevel}) translate(${panX}px, ${panY}px)`;
        if (zoomBadge) zoomBadge.textContent = `${Math.round(zoomLevel * 100)}%`;
        if (btnZoomReset) btnZoomReset.style.display = zoomLevel > 1.05 ? 'inline-flex' : 'none';
        if (btnZoomOut) btnZoomOut.disabled = zoomLevel <= 1;
        if (btnZoomIn) btnZoomIn.disabled = zoomLevel >= 2.5;
        zoomContainer.classList.toggle('zoomed', zoomLevel > 1.05);
      }

      function setZoom(newZoom) {
        zoomLevel = Math.max(1, Math.min(2.5, Math.round(newZoom * 100) / 100));
        clampPan();
        updateZoomUI(false);
      }

      function zoomIn() {
        setZoom(zoomLevel + 0.25);
      }

      function zoomOut() {
        setZoom(zoomLevel - 0.25);
      }

      function resetZoom() {
        panX = 0;
        panY = 0;
        setZoom(1);
      }

      if (btnZoomIn) btnZoomIn.addEventListener('click', zoomIn);
      if (btnZoomOut) btnZoomOut.addEventListener('click', zoomOut);
      if (btnZoomReset) btnZoomReset.addEventListener('click', resetZoom);

      // Double-click to toggle zoom
      zoomContainer.addEventListener('dblclick', (e) => {
        if (e.target.closest('.nav-arrow') || e.target.closest('button')) return;
        if (zoomLevel > 1.05) {
          resetZoom();
        } else {
          setZoom(1.75);
        }
      });

      // Pan dragging when zoomed in
      zoomContainer.addEventListener('mousedown', (e) => {
        if (zoomLevel <= 1.05 || e.button !== 0) return;
        if (e.target.closest('button') || e.target.closest('.nav-arrow')) return;
        isPanning = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        panStartX = panX;
        panStartY = panY;
        zoomContainer.classList.add('panning');
        e.stopPropagation();
      });

      window.addEventListener('mousemove', (e) => {
        if (!isPanning || zoomLevel <= 1.05) return;
        const dx = (e.clientX - dragStartX) / zoomLevel;
        const dy = (e.clientY - dragStartY) / zoomLevel;
        panX = panStartX + dx;
        panY = panStartY + dy;
        clampPan();
        updateZoomUI(true);
      });

      window.addEventListener('mouseup', () => {
        if (isPanning) {
          isPanning = false;
          zoomContainer.classList.remove('panning');
        }
      });

      // Mouse wheel zoom with Ctrl key
      stage.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          if (e.deltaY < 0) {
            zoomIn();
          } else {
            zoomOut();
          }
        }
      }, { passive: false });

      // Update UI on Flip
      pageFlip.on('flip', (e) => {
        playFlipSound();
        const cur = e.data; // 0-indexed
        updateUI(cur);
      });

      pageFlip.on('init', () => {
        loader.classList.add('fade-out');
        setTimeout(() => loader.style.display = 'none', 450);
        updateUI(0);
      });

      function updateUI(pageIdx) {
        const displayNum = pageIdx + 1;
        pageNumEl.textContent = displayNum;
        scrubber.value = displayNum;

        // Auto-center single cover and back cover in landscape spread
        const isMobile = window.innerWidth <= 768;
        if (!isMobile) {
          if (pageIdx === 0) {
            bookEl.style.transform = 'translateX(-25%)';
          } else if (pageIdx >= TOTAL_PAGES - 1) {
            bookEl.style.transform = 'translateX(25%)';
          } else {
            bookEl.style.transform = 'translateX(0)';
          }
        } else {
          bookEl.style.transform = 'translateX(0)';
        }

        // Active thumbnail
        document.querySelectorAll('.thumb-item').forEach((el, idx) => {
          el.classList.toggle('active', idx === pageIdx);
        });

        // Prev/Next disable state
        arrowPrev.classList.toggle('disabled', pageIdx === 0);
        arrowNext.classList.toggle('disabled', pageIdx >= TOTAL_PAGES - 1);
        btnPrev.style.opacity = pageIdx === 0 ? '0.3' : '1';
        btnNext.style.opacity = pageIdx >= TOTAL_PAGES - 1 ? '0.3' : '1';
        btnFirst.style.opacity = pageIdx === 0 ? '0.3' : '1';
        btnLast.style.opacity = pageIdx >= TOTAL_PAGES - 1 ? '0.3' : '1';
      }

      // Button Listeners
      btnPrev.addEventListener('click', () => pageFlip.flipPrev());
      btnNext.addEventListener('click', () => pageFlip.flipNext());
      arrowPrev.addEventListener('click', () => pageFlip.flipPrev());
      arrowNext.addEventListener('click', () => pageFlip.flipNext());
      btnFirst.addEventListener('click', () => pageFlip.flip(0));
      btnLast.addEventListener('click', () => pageFlip.flip(TOTAL_PAGES - 1));

      // Scrubber Listener
      scrubber.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10) - 1;
        pageFlip.flip(val);
      });

      // Sound Toggle
      btnSound.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        btnSound.innerHTML = soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
        btnSound.style.color = soundEnabled ? '' : '#888';
      });

      // Thumbs Drawer Toggle
      btnThumbs.addEventListener('click', () => {
        thumbDrawer.classList.toggle('open');
      });

      // Close thumbs drawer when clicking stage
      stage.addEventListener('click', (e) => {
        if (!e.target.closest('#thumb-drawer') && !e.target.closest('#btn-thumbs')) {
          thumbDrawer.classList.remove('open');
        }
      });

      // Keyboard arrow navigation & zoom keys
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
          pageFlip.flipNext();
        } else if (e.key === 'ArrowLeft') {
          pageFlip.flipPrev();
        } else if (e.key === 'Home') {
          pageFlip.flip(0);
        } else if (e.key === 'End') {
          pageFlip.flip(TOTAL_PAGES - 1);
        } else if (e.key === 'Escape') {
          thumbDrawer.classList.remove('open');
          if (zoomLevel > 1) resetZoom();
        } else if (e.key === '=' || e.key === '+') {
          zoomIn();
        } else if (e.key === '-' || e.key === '_') {
          zoomOut();
        } else if (e.key === '0') {
          resetZoom();
        }
      });

      // Fullscreen Toggle
      btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          btnFullscreen.innerHTML = '<i class="fas fa-compress"></i>';
        } else {
          document.exitFullscreen().catch(() => {});
          btnFullscreen.innerHTML = '<i class="fas fa-expand"></i>';
        }
      });

      document.addEventListener('fullscreenchange', () => {
        const isFS = !!document.fullscreenElement;
        btnFullscreen.innerHTML = isFS ? '<i class="fas fa-compress"></i>' : '<i class="fas fa-expand"></i>';
      });

      // Responsive Resize Handling
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          const newDims = getStageDimensions();
          pageFlip.update({
            width: newDims.width,
            height: newDims.height
          });
          clampPan();
          updateZoomUI();
        }, 200);
      });
    });
  </script>
</body>
</html>
