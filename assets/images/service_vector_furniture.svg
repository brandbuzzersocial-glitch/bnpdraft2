<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="furnBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F6EFE6"/>
      <stop offset="100%" stop-color="#EBE2D3"/>
    </linearGradient>
    <linearGradient id="goldLinearFurn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C785"/>
      <stop offset="50%" stop-color="#CAA05C"/>
      <stop offset="100%" stop-color="#99732B"/>
    </linearGradient>
    <linearGradient id="walnutWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D2B1F"/>
      <stop offset="25%" stop-color="#4F3828"/>
      <stop offset="50%" stop-color="#38261B"/>
      <stop offset="75%" stop-color="#553C2B"/>
      <stop offset="100%" stop-color="#302016"/>
    </linearGradient>
    <linearGradient id="oakWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A57A4C"/>
      <stop offset="50%" stop-color="#B88A58"/>
      <stop offset="100%" stop-color="#8F673E"/>
    </linearGradient>
    <linearGradient id="germanCnc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D333F"/>
      <stop offset="100%" stop-color="#14171F"/>
    </linearGradient>
    <pattern id="archGridFurn" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#CAA05C" stroke-width="0.5" stroke-opacity="0.15"/>
      <circle cx="22" cy="0" r="0.75" fill="#CAA05C" fill-opacity="0.25"/>
    </pattern>
    <filter id="furnDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14171F" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#furnBgGrad)"/>
  <rect width="600" height="360" fill="url(#archGridFurn)"/>

  <!-- Joinery & Factory Precision Calibration Grid Blueprint -->
  <g opacity="0.35">
    <circle cx="300" cy="180" r="140" fill="none" stroke="#CAA05C" stroke-width="0.8" stroke-dasharray="3 5"/>
    <circle cx="300" cy="180" r="110" fill="none" stroke="#2D333F" stroke-width="0.6"/>
    <!-- Mortise and Tenon Joinery Exploded Projection Lines -->
    <line x1="120" y1="180" x2="480" y2="180" stroke="#CAA05C" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="300" y1="40" x2="300" y2="300" stroke="#CAA05C" stroke-width="0.8" stroke-dasharray="4 4"/>
  </g>

  <!-- Floor Horizon -->
  <polygon points="0,265 600,265 600,360 0,360" fill="#E2D6C3" opacity="0.85"/>
  <line x1="0" y1="265" x2="600" y2="265" stroke="#CAA05C" stroke-width="1.2"/>

  <!-- HOMAG / Precision CNC Cutter Beam in Background Header -->
  <g transform="translate(100, 35)">
    <rect x="0" y="0" width="400" height="16" rx="3" fill="url(#germanCnc)"/>
    <line x1="0" y1="16" x2="400" y2="16" stroke="url(#goldLinearFurn)" stroke-width="1.5"/>
    <!-- Laser / Diamond Spindle Carriage -->
    <rect x="180" y="16" width="40" height="24" rx="2" fill="url(#goldLinearFurn)"/>
    <polygon points="195,40 205,40 200,55" fill="#14171F"/>
    <line x1="200" y1="55" x2="200" y2="105" stroke="#CAA05C" stroke-width="1.5" stroke-dasharray="2 3"/>
    <circle cx="200" cy="105" r="3" fill="#CAA05C"/>
  </g>

  <!-- Bespoke Furniture Showcase Composition (Cabinetry & Credenza + Sculptural Chair) -->
  <g filter="url(#furnDropShadow)">
    <!-- Bespoke Fluted Walnut Credenza / Console Unit -->
    <g transform="translate(120, 155)">
      <!-- Main Cabinet Body -->
      <rect x="0" y="0" width="230" height="95" rx="6" fill="url(#walnutWood)"/>
      <rect x="0" y="0" width="230" height="95" rx="6" fill="none" stroke="url(#goldLinearFurn)" stroke-width="1.5"/>
      
      <!-- Italian Marble Top Inset -->
      <rect x="-4" y="-8" width="238" height="10" rx="3" fill="#FAF7F2" stroke="url(#goldLinearFurn)" stroke-width="1.5"/>
      <line x1="20" y1="-3" x2="80" y2="-3" stroke="#D8C8B5" stroke-width="1"/>
      <line x1="120" y1="-3" x2="200" y2="-3" stroke="#D8C8B5" stroke-width="1"/>

      <!-- Fluted Door Panels -->
      <g stroke="#CAA05C" stroke-width="1" opacity="0.65">
        <line x1="76" y1="0" x2="76" y2="95"/>
        <line x1="154" y1="0" x2="154" y2="95"/>
        <!-- Slats in Door 1 -->
        <line x1="15" y1="10" x2="15" y2="85"/>
        <line x1="30" y1="10" x2="30" y2="85"/>
        <line x1="45" y1="10" x2="45" y2="85"/>
        <line x1="60" y1="10" x2="60" y2="85"/>
        <!-- Slats in Door 2 -->
        <line x1="92" y1="10" x2="92" y2="85"/>
        <line x1="107" y1="10" x2="107" y2="85"/>
        <line x1="122" y1="10" x2="122" y2="85"/>
        <line x1="137" y1="10" x2="137" y2="85"/>
        <!-- Slats in Door 3 -->
        <line x1="170" y1="10" x2="170" y2="85"/>
        <line x1="185" y1="10" x2="185" y2="85"/>
        <line x1="200" y1="10" x2="200" y2="85"/>
        <line x1="215" y1="10" x2="215" y2="85"/>
      </g>

      <!-- Brushed Brass Handles -->
      <rect x="70" y="40" width="3" height="18" rx="1.5" fill="url(#goldLinearFurn)"/>
      <rect x="80" y="40" width="3" height="18" rx="1.5" fill="url(#goldLinearFurn)"/>
      <rect x="160" y="40" width="3" height="18" rx="1.5" fill="url(#goldLinearFurn)"/>

      <!-- Tapered Brass Legs -->
      <polygon points="15,95 21,95 18,125 14,125" fill="url(#goldLinearFurn)"/>
      <polygon points="65,95 71,95 68,125 64,125" fill="url(#goldLinearFurn)"/>
      <polygon points="165,95 171,95 168,125 164,125" fill="url(#goldLinearFurn)"/>
      <polygon points="215,95 221,95 218,125 214,125" fill="url(#goldLinearFurn)"/>
    </g>

    <!-- Bespoke Handcrafted Lounge Armchair (Foreground Right) -->
    <g transform="translate(380, 140)">
      <!-- Sculptural Curved Back Shell (Steam-bent Oak) -->
      <path d="M 15,30 Q 75,-15 125,25 Q 135,50 115,85 Q 70,60 20,80 Z" fill="url(#oakWood)" stroke="url(#goldLinearFurn)" stroke-width="1.5"/>
      
      <!-- Deep Button-Tufted Charcoal Cushion -->
      <ellipse cx="68" cy="72" rx="46" ry="24" fill="url(#germanCnc)"/>
      <ellipse cx="68" cy="72" rx="46" ry="24" fill="none" stroke="url(#goldLinearFurn)" stroke-width="1.2"/>
      
      <!-- Tuft Dimples -->
      <circle cx="50" cy="70" r="2.5" fill="url(#goldLinearFurn)"/>
      <circle cx="68" cy="66" r="2.5" fill="url(#goldLinearFurn)"/>
      <circle cx="86" cy="70" r="2.5" fill="url(#goldLinearFurn)"/>
      <circle cx="58" cy="78" r="2" fill="url(#goldLinearFurn)"/>
      <circle cx="78" cy="78" r="2" fill="url(#goldLinearFurn)"/>

      <!-- Splayed Mid-Century Tapered Wood Legs with Brass Ferrules -->
      <!-- Left Front Leg -->
      <polygon points="35,90 40,90 28,140 23,140" fill="url(#walnutWood)"/>
      <polygon points="27,130 29,130 28,140 23,140" fill="url(#goldLinearFurn)"/>
      <!-- Right Front Leg -->
      <polygon points="98,90 103,90 112,140 107,140" fill="url(#walnutWood)"/>
      <polygon points="108,130 110,130 112,140 107,140" fill="url(#goldLinearFurn)"/>
      <!-- Rear Leg -->
      <polygon points="68,90 72,90 70,132 66,132" fill="#241B13"/>
    </g>

    <!-- Master Woodcraft / Chiseling Dovetail Detail Badge (Center Top) -->
    <g transform="translate(435, 60)">
      <!-- Wood Joint Exploded Blueprint Geometry -->
      <polygon points="0,0 25,0 20,20 5,20" fill="url(#oakWood)" stroke="url(#goldLinearFurn)" stroke-width="1"/>
      <polygon points="30,0 55,0 50,20 35,20" fill="url(#oakWood)" stroke="url(#goldLinearFurn)" stroke-width="1"/>
      <!-- Dimension Arrow -->
      <line x1="0" y1="-8" x2="55" y2="-8" stroke="#CAA05C" stroke-width="1"/>
      <polyline points="4,-11 0,-8 4,-5" fill="none" stroke="#CAA05C" stroke-width="1"/>
      <polyline points="51,-11 55,-8 51,-5" fill="none" stroke="#CAA05C" stroke-width="1"/>
    </g>
  </g>

  <!-- Architectural Tag Overlay at Bottom Left -->
  <g transform="translate(30, 325)">
    <rect x="0" y="0" width="225" height="22" rx="4" fill="#14171F" opacity="0.85"/>
    <circle cx="12" cy="11" r="3" fill="#CAA05C"/>
    <text x="24" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">BESPOKE FURNITURE / HOMAG CNC</text>
  </g>

  <!-- Elegant Gold Border Frame -->
  <rect x="12" y="12" width="576" height="336" fill="none" stroke="#CAA05C" stroke-width="1" opacity="0.35"/>
  <rect x="16" y="16" width="568" height="328" fill="none" stroke="#CAA05C" stroke-width="0.5" opacity="0.2"/>
</svg>