<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bimBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </linearGradient>
    <linearGradient id="goldLinearBim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C785"/>
      <stop offset="50%" stop-color="#CAA05C"/>
      <stop offset="100%" stop-color="#99732B"/>
    </linearGradient>
    <linearGradient id="bimSolidBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A3854"/>
      <stop offset="100%" stop-color="#141D2D"/>
    </linearGradient>
    <pattern id="archGridBim" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CAA05C" stroke-width="0.5" stroke-opacity="0.18"/>
      <circle cx="20" cy="0" r="0.75" fill="#CAA05C" fill-opacity="0.25"/>
    </pattern>
    <filter id="bimDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#141D2D" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bimBgGrad)"/>
  <rect width="600" height="360" fill="url(#archGridBim)"/>

  <!-- Polar Calibration Coordinate Rings & Angle Radials -->
  <g transform="translate(300, 175)" opacity="0.35">
    <circle cx="0" cy="0" r="145" fill="none" stroke="#CAA05C" stroke-width="0.75" stroke-dasharray="3 6"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#2A3854" stroke-width="0.75"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#CAA05C" stroke-width="0.5" stroke-dasharray="2 4"/>
    <!-- Compass Crosshairs -->
    <line x1="-155" y1="0" x2="155" y2="0" stroke="#CAA05C" stroke-width="0.75"/>
    <line x1="0" y1="-155" x2="0" y2="155" stroke="#CAA05C" stroke-width="0.75"/>
  </g>

  <!-- 3D BIM Wireframe Volumetric Spatial Model (Center Isometric Structure) -->
  <g filter="url(#bimDropShadow)">
    <!-- Base 2D Architectural Floor Plan Sheet (Flat on Ground Plane) -->
    <g transform="translate(140, 185)">
      <polygon points="0,50 160,0 320,50 160,100" fill="#FFFFFF" opacity="0.85" stroke="url(#goldLinearBim)" stroke-width="1.5"/>
      <!-- Inner Wall Partitions on 2D Plan -->
      <polyline points="50,47 130,22 210,47 130,72 50,47" fill="none" stroke="#CAA05C" stroke-width="1" stroke-dasharray="3 2"/>
      <line x1="130" y1="22" x2="130" y2="72" stroke="#CAA05C" stroke-width="1"/>
      <line x1="90" y1="35" x2="170" y2="60" stroke="#CAA05C" stroke-width="1"/>
      <!-- Room Annotation Markers -->
      <circle cx="100" cy="45" r="3" fill="#CAA05C"/>
      <circle cx="160" cy="40" r="3" fill="#CAA05C"/>
      <circle cx="130" cy="55" r="3" fill="#CAA05C"/>
    </g>

    <!-- 3D BIM Volumetric Extruded Wireframe (Rising from 2D Floor Plan) -->
    <g transform="translate(140, 75)">
      <!-- Vertical Extrusion Elevation Projection Rays -->
      <g stroke="#CAA05C" stroke-width="1" stroke-dasharray="4 3" opacity="0.6">
        <line x1="0" y1="160" x2="0" y2="60"/>
        <line x1="160" y1="110" x2="160" y2="10"/>
        <line x1="320" y1="160" x2="320" y2="60"/>
        <line x1="160" y1="210" x2="160" y2="110"/>
      </g>

      <!-- Isometric BIM Slab Top -->
      <polygon points="0,60 160,10 320,60 160,110" fill="url(#bimSolidBlue)" opacity="0.9"/>
      <polygon points="0,60 160,10 320,60 160,110" fill="none" stroke="url(#goldLinearBim)" stroke-width="2"/>

      <!-- Inner Room Spatial Volume Cutaway (Glass / Mesh Effect) -->
      <polygon points="40,56 160,18 280,56 160,94" fill="#EBF2FA" opacity="0.2" stroke="#CAA05C" stroke-width="1"/>

      <!-- Vertical Corner Columns of 3D Model -->
      <line x1="0" y1="60" x2="0" y2="150" stroke="url(#goldLinearBim)" stroke-width="2"/>
      <line x1="320" y1="60" x2="320" y2="150" stroke="url(#goldLinearBim)" stroke-width="2"/>
      <line x1="160" y1="110" x2="160" y2="200" stroke="url(#goldLinearBim)" stroke-width="2.5"/>

      <!-- Solid Left Facade with Architectural Glazing Bands -->
      <polygon points="0,60 160,110 160,200 0,150" fill="url(#bimSolidBlue)"/>
      <polygon points="0,60 160,110 160,200 0,150" fill="none" stroke="url(#goldLinearBim)" stroke-width="1.5"/>
      <!-- Ribbon Windows on Left Facade -->
      <polygon points="20,80 140,118 140,132 20,94" fill="#FFFFFF" opacity="0.9"/>
      <polygon points="20,108 140,146 140,160 20,122" fill="#FFFFFF" opacity="0.9"/>

      <!-- Wireframe / Mesh Right Facade (BIM Coordinate Nodes) -->
      <polygon points="160,110 320,60 320,150 160,200" fill="#202A3C" opacity="0.8"/>
      <polygon points="160,110 320,60 320,150 160,200" fill="none" stroke="url(#goldLinearBim)" stroke-width="1.5"/>
      <!-- Mesh Wireframe Lines on Right Facade -->
      <g stroke="#CAA05C" stroke-width="1" opacity="0.7">
        <line x1="200" y1="97" x2="200" y2="187"/>
        <line x1="240" y1="85" x2="240" y2="175"/>
        <line x1="280" y1="72" x2="280" y2="162"/>
        <line x1="160" y1="140" x2="320" y2="90"/>
        <line x1="160" y1="170" x2="320" y2="120"/>
      </g>
      <!-- BIM Coordinate Nodes (Small Gold Dots at vertices) -->
      <circle cx="160" cy="110" r="4" fill="url(#goldLinearBim)"/>
      <circle cx="200" cy="97" r="3" fill="url(#goldLinearBim)"/>
      <circle cx="240" cy="85" r="3" fill="url(#goldLinearBim)"/>
      <circle cx="280" cy="72" r="3" fill="url(#goldLinearBim)"/>
      <circle cx="320" cy="60" r="4" fill="url(#goldLinearBim)"/>
      <circle cx="160" cy="200" r="4" fill="url(#goldLinearBim)"/>
      <circle cx="320" cy="150" r="4" fill="url(#goldLinearBim)"/>
    </g>

    <!-- Architectural Drafting Compass Tool (Left Foreground) -->
    <g transform="translate(80, 160)">
      <!-- Compass Legs -->
      <line x1="40" y1="10" x2="10" y2="105" stroke="url(#goldLinearBim)" stroke-width="3"/>
      <line x1="40" y1="10" x2="70" y2="105" stroke="url(#goldLinearBim)" stroke-width="3"/>
      <!-- Hinge Joint -->
      <circle cx="40" cy="10" r="7" fill="url(#bimSolidBlue)" stroke="url(#goldLinearBim)" stroke-width="2"/>
      <circle cx="40" cy="10" r="2.5" fill="#CAA05C"/>
      <!-- Needle Point & Lead Tip -->
      <polygon points="8,105 12,105 10,118" fill="#141D2D"/>
      <polygon points="68,105 72,105 70,118" fill="#141D2D"/>
      <!-- Adjustment Thumb Screw & Arc -->
      <path d="M 22,50 Q 40,60 58,50" fill="none" stroke="url(#goldLinearBim)" stroke-width="1.5"/>
      <circle cx="40" cy="55" r="4" fill="url(#goldLinearBim)"/>
    </g>

    <!-- 3D BIM Coordinate Axes Gizmo (Right Foreground) -->
    <g transform="translate(480, 210)">
      <!-- Z Axis (Up) -->
      <line x1="0" y1="0" x2="0" y2="-45" stroke="url(#goldLinearBim)" stroke-width="2"/>
      <polygon points="-3,-45 3,-45 0,-55" fill="url(#goldLinearBim)"/>
      <text x="8" y="-45" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#CAA05C">Z</text>
      <!-- X Axis (Right) -->
      <line x1="0" y1="0" x2="40" y2="15" stroke="#2A3854" stroke-width="2"/>
      <polygon points="40,11 44,19 49,18" fill="#2A3854"/>
      <text x="46" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#2A3854">X</text>
      <!-- Y Axis (Left) -->
      <line x1="0" y1="0" x2="-35" y2="18" stroke="#CAA05C" stroke-width="2"/>
      <polygon points="-35,14 -39,22 -44,21" fill="#CAA05C"/>
      <text x="-48" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#CAA05C">Y</text>
      <!-- Origin Center Sphere -->
      <circle cx="0" cy="0" r="4" fill="url(#goldLinearBim)"/>
    </g>
  </g>



  <!-- Elegant Gold Border Frame -->
  <rect x="12" y="12" width="576" height="336" fill="none" stroke="#CAA05C" stroke-width="1" opacity="0.35"/>
  <rect x="16" y="16" width="568" height="328" fill="none" stroke="#CAA05C" stroke-width="0.5" opacity="0.2"/>
</svg>