<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73"/>
      <stop offset="50%" stop-color="#CAA05C"/>
      <stop offset="100%" stop-color="#9E7530"/>
    </linearGradient>
    <linearGradient id="navyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24375A"/>
      <stop offset="100%" stop-color="#111B2E"/>
    </linearGradient>
    <pattern id="gridPattern2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CAA05C" stroke-width="0.5" stroke-opacity="0.14"/>
      <circle cx="20" cy="0" r="0.75" fill="#CAA05C" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#bgGrad2)"/>
  <rect width="400" height="250" fill="url(#gridPattern2)"/>

  <!-- Radial Glow -->
  <circle cx="200" cy="125" r="90" fill="#CAA05C" fill-opacity="0.05"/>

  <!-- Architectural Trust Shield Geometry -->
  <g transform="translate(200, 120)">
    <!-- Outer Calibration Circle -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="#CAA05C" stroke-width="0.75" stroke-dasharray="3,6" opacity="0.4"/>
    <circle cx="0" cy="0" r="74" fill="none" stroke="#1B2A4A" stroke-width="1" opacity="0.18"/>

    <!-- Twin Classical Architectural Foundation Columns (Structural Pillars of Trust) -->
    <!-- Left Pillar -->
    <g transform="translate(-62, -45)">
      <!-- Capital -->
      <rect x="-14" y="0" width="28" height="6" rx="1.5" fill="url(#goldGrad2)"/>
      <rect x="-10" y="6" width="20" height="4" fill="#24375A"/>
      <!-- Shaft with fluting lines -->
      <rect x="-8" y="10" width="16" height="70" fill="url(#navyGrad2)"/>
      <line x1="-3" y1="10" x2="-3" y2="80" stroke="#CAA05C" stroke-width="0.75" opacity="0.6"/>
      <line x1="3" y1="10" x2="3" y2="80" stroke="#CAA05C" stroke-width="0.75" opacity="0.6"/>
      <!-- Base -->
      <rect x="-10" y="80" width="20" height="4" fill="#24375A"/>
      <rect x="-14" y="84" width="28" height="6" rx="1.5" fill="url(#goldGrad2)"/>
    </g>

    <!-- Right Pillar -->
    <g transform="translate(62, -45)">
      <!-- Capital -->
      <rect x="-14" y="0" width="28" height="6" rx="1.5" fill="url(#goldGrad2)"/>
      <rect x="-10" y="6" width="20" height="4" fill="#24375A"/>
      <!-- Shaft with fluting lines -->
      <rect x="-8" y="10" width="16" height="70" fill="url(#navyGrad2)"/>
      <line x1="-3" y1="10" x2="-3" y2="80" stroke="#CAA05C" stroke-width="0.75" opacity="0.6"/>
      <line x1="3" y1="10" x2="3" y2="80" stroke="#CAA05C" stroke-width="0.75" opacity="0.6"/>
      <!-- Base -->
      <rect x="-10" y="80" width="20" height="4" fill="#24375A"/>
      <rect x="-14" y="84" width="28" height="6" rx="1.5" fill="url(#goldGrad2)"/>
    </g>

    <!-- Architrave / Top Crossbeam -->
    <rect x="-82" y="-55" width="164" height="10" rx="2" fill="url(#navyGrad2)" stroke="#CAA05C" stroke-width="1"/>
    <rect x="-76" y="-45" width="152" height="4" fill="url(#goldGrad2)"/>

    <!-- Central Geometric Handshake & Trust Seal -->
    <!-- Geometric Shield Emblem -->
    <path d="M 0 -32 L 42 -12 L 42 22 C 42 50 0 72 0 72 C 0 72 -42 50 -42 22 L -42 -12 Z" fill="#FFFFFF" stroke="url(#goldGrad2)" stroke-width="2" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.08))"/>
    
    <!-- Shield Inner Fill -->
    <path d="M 0 -26 L 36 -8 L 36 20 C 36 44 0 64 0 64 C 0 64 -36 44 -36 20 L -36 -8 Z" fill="#FAF7F2" stroke="#1B2A4A" stroke-width="0.75" opacity="0.5"/>

    <!-- Modern Architectural Geometric Handshake Vector -->
    <g transform="translate(0, 10)">
      <!-- Left Hand / Cuff Geometric Path -->
      <path d="M -26 -16 L -16 -16 L -4 -4 L -9 3 L -19 -5 L -26 -5 Z" fill="url(#navyGrad2)"/>
      <rect x="-28" y="-18" width="5" height="15" rx="1" fill="url(#goldGrad2)"/>

      <!-- Right Hand / Cuff Geometric Path -->
      <path d="M 26 -16 L 16 -16 L 4 -4 L 9 3 L 19 -5 L 26 -5 Z" fill="#24375A"/>
      <rect x="23" y="-18" width="5" height="15" rx="1" fill="url(#goldGrad2)"/>

      <!-- Interlocking Grip Core -->
      <path d="M -7 -4 L 0 -10 L 7 -4 L 4 4 L -4 4 Z" fill="url(#goldGrad2)"/>
      <polygon points="0,-12 8,-5 0,3 -8,-5" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="0" cy="-5" r="2.5" fill="#1B2A4A"/>

      <!-- Checkmark of Verified Quality -->
      <circle cx="0" cy="28" r="11" fill="url(#goldGrad2)"/>
      <polyline points="-4,28 -1,31 5,24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Plumb Line & Level Indicator Markers -->
    <line x1="0" y1="-80" x2="0" y2="-55" stroke="#CAA05C" stroke-width="1.5"/>
    <circle cx="0" cy="-80" r="2.5" fill="#CAA05C"/>
  </g>

  <!-- Metric Badges Left & Right -->
  <g transform="translate(68, 120)">
    <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="0.8" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.04))"/>
    <text x="0" y="-3" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#CAA05C" text-anchor="middle">60%+</text>
    <text x="0" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#1B2A4A" text-anchor="middle" letter-spacing="0.5">REPEAT BIZ</text>
  </g>

  <g transform="translate(332, 120)">
    <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="0.8" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.04))"/>
    <text x="0" y="-3" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#CAA05C" text-anchor="middle">100%</text>
    <text x="0" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#1B2A4A" text-anchor="middle" letter-spacing="0.5">ON-TIME SITE</text>
  </g>

  <!-- Technical Spec Footer Pill -->
  <g transform="translate(200, 236)">
    <rect x="-75" y="-10" width="150" height="20" rx="10" fill="#FFFFFF" stroke="#CAA05C" stroke-width="1" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <circle cx="-58" cy="0" r="3" fill="#CAA05C"/>
    <text x="0" y="3.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#1B2A4A" text-anchor="middle" letter-spacing="1.2">UNWAVERING COMMITMENT</text>
    <circle cx="58" cy="0" r="3" fill="#CAA05C"/>
  </g>
</svg>