<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
    <linearGradient id="goldGradV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73"/>
      <stop offset="50%" stop-color="#CAA05C"/>
      <stop offset="100%" stop-color="#9E7530"/>
    </linearGradient>
    <linearGradient id="navyGradV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24375A"/>
      <stop offset="100%" stop-color="#111B2E"/>
    </linearGradient>
    <pattern id="gridPatternV" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CAA05C" stroke-width="0.5" stroke-opacity="0.14"/>
      <circle cx="20" cy="0" r="0.75" fill="#CAA05C" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#bgGradV)"/>
  <rect width="400" height="250" fill="url(#gridPatternV)"/>

  <!-- Optical Compass Radial Rays (Vision Projection) -->
  <g transform="translate(200, 60)" stroke="url(#goldGradV)" stroke-width="0.75" opacity="0.35">
    <line x1="0" y1="0" x2="-140" y2="120" stroke-dasharray="3,4"/>
    <line x1="0" y1="0" x2="-80" y2="130" stroke-dasharray="3,4"/>
    <line x1="0" y1="0" x2="0" y2="135" stroke-dasharray="3,4"/>
    <line x1="0" y1="0" x2="80" y2="130" stroke-dasharray="3,4"/>
    <line x1="0" y1="0" x2="140" y2="120" stroke-dasharray="3,4"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#CAA05C" stroke-width="0.8" stroke-dasharray="2,3"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#CAA05C" stroke-width="0.6" stroke-dasharray="4,5"/>
  </g>

  <!-- Architectural Horizon Line -->
  <line x1="30" y1="185" x2="370" y2="185" stroke="#1B2A4A" stroke-width="1.2" opacity="0.4"/>
  <text x="35" y="198" font-family="monospace" font-size="6" fill="#1B2A4A" opacity="0.5">DATUM 0.00 HORIZON</text>

  <!-- Wireframe Architectural Landmark Skyline (Our Vision Landmark) -->
  <g transform="translate(200, 185)">
    <!-- Central Skyscraper / Iconic Tower -->
    <polygon points="-35,0 -35,-115 0,-140 35,-115 35,0" fill="#FFFFFF" stroke="#24375A" stroke-width="1.4" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.06))"/>
    
    <!-- Facade Mullion Grid -->
    <line x1="0" y1="-140" x2="0" y2="0" stroke="url(#goldGradV)" stroke-width="1.5"/>
    <line x1="-18" y1="-128" x2="-18" y2="0" stroke="#CAA05C" stroke-width="0.75" opacity="0.6"/>
    <line x1="18" y1="-128" x2="18" y2="0" stroke="#CAA05C" stroke-width="0.75" opacity="0.6"/>

    <!-- Floor Level Horizontal Slabs -->
    <line x1="-35" y1="-25" x2="35" y2="-25" stroke="#1B2A4A" stroke-width="0.6" opacity="0.35"/>
    <line x1="-35" y1="-50" x2="35" y2="-50" stroke="#1B2A4A" stroke-width="0.6" opacity="0.35"/>
    <line x1="-35" y1="-75" x2="35" y2="-75" stroke="#1B2A4A" stroke-width="0.6" opacity="0.35"/>
    <line x1="-35" y1="-100" x2="35" y2="-100" stroke="#1B2A4A" stroke-width="0.6" opacity="0.35"/>

    <!-- Left Flanking Pavilions -->
    <polygon points="-85,0 -85,-70 -45,-85 -45,0" fill="#F7F3EC" stroke="#24375A" stroke-width="1" opacity="0.9"/>
    <line x1="-65" y1="-77" x2="-65" y2="0" stroke="#CAA05C" stroke-width="0.6" opacity="0.5"/>
    <line x1="-85" y1="-35" x2="-45" y2="-35" stroke="#1B2A4A" stroke-width="0.5" opacity="0.3"/>

    <!-- Right Flanking Pavilions -->
    <polygon points="45,0 45,-85 85,-70 85,0" fill="#F7F3EC" stroke="#24375A" stroke-width="1" opacity="0.9"/>
    <line x1="65" y1="-77" x2="65" y2="0" stroke="#CAA05C" stroke-width="0.6" opacity="0.5"/>
    <line x1="45" y1="-35" x2="85" y2="-35" stroke="#1B2A4A" stroke-width="0.5" opacity="0.3"/>

    <!-- Far Outer Geometric Skyline Wings -->
    <polygon points="-125,0 -125,-45 -95,-45 -95,0" fill="#EFE8DC" stroke="#24375A" stroke-width="0.8" opacity="0.75"/>
    <polygon points="95,0 95,-45 125,-45 125,0" fill="#EFE8DC" stroke="#24375A" stroke-width="0.8" opacity="0.75"/>

    <!-- Tower Apex Beacon & Calibration Target -->
    <circle cx="0" cy="-140" r="5" fill="url(#goldGradV)" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Elevation Callout Tag -->
    <line x1="0" y1="-140" x2="52" y2="-155" stroke="url(#goldGradV)" stroke-width="1"/>
    <line x1="52" y1="-155" x2="95" y2="-155" stroke="url(#goldGradV)" stroke-width="1"/>
    <circle cx="95" cy="-155" r="2" fill="#CAA05C"/>
    <text x="74" y="-160" font-family="'Plus Jakarta Sans', monospace" font-size="6.5" font-weight="700" fill="#24375A" text-anchor="middle">ELEV. +180M</text>
  </g>

  <!-- Precision Theodolite / Visionary Reticle Badge -->
  <g transform="translate(62, 58)">
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="url(#goldGradV)" stroke-width="1.4" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.05))"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#24375A" stroke-width="0.8" stroke-dasharray="2,2"/>
    <!-- Crosshairs -->
    <line x1="-16" y1="0" x2="16" y2="0" stroke="url(#goldGradV)" stroke-width="1.2"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="url(#goldGradV)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3" fill="#24375A"/>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#24375A" text-anchor="middle" letter-spacing="0.5">VISION</text>
  </g>

  <!-- Bottom Technical Blueprint Strip -->
  <g transform="translate(200, 222)">
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#CAA05C" stroke-width="0.75"/>
    <line x1="-150" y1="-3" x2="-150" y2="3" stroke="#CAA05C" stroke-width="0.75"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="url(#goldGradV)" stroke-width="1"/>
    <line x1="150" y1="-3" x2="150" y2="3" stroke="#CAA05C" stroke-width="0.75"/>
    <text x="0" y="14" font-family="'Plus Jakarta Sans', monospace" font-size="6.5" font-weight="700" fill="#1B2A4A" opacity="0.65" text-anchor="middle" letter-spacing="1">TRUSTED &amp; ETHICAL CONTRACTING • NATIONWIDE HORIZON</text>
  </g>
</svg>
