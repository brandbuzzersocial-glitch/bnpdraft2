<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73"/>
      <stop offset="50%" stop-color="#CAA05C"/>
      <stop offset="100%" stop-color="#9E7530"/>
    </linearGradient>
    <linearGradient id="navyGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24375A"/>
      <stop offset="100%" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CAA05C" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="gridPattern3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CAA05C" stroke-width="0.5" stroke-opacity="0.14"/>
      <circle cx="20" cy="0" r="0.75" fill="#CAA05C" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#bgGrad3)"/>
  <rect width="400" height="250" fill="url(#gridPattern3)"/>

  <!-- High-Tech Parametric Wave Lines -->
  <path d="M 40 180 C 100 130, 140 210, 200 160 C 260 110, 300 190, 360 140" fill="none" stroke="#CAA05C" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
  <path d="M 40 195 C 100 145, 140 225, 200 175 C 260 125, 300 205, 360 155" fill="none" stroke="#1B2A4A" stroke-width="0.6" opacity="0.25"/>

  <!-- Digital ERP / IoT Circuit Tracks & Nodes -->
  <g stroke="#1B2A4A" stroke-width="1" fill="none" opacity="0.35">
    <polyline points="45,45 80,45 105,70"/>
    <circle cx="45" cy="45" r="2.5" fill="#CAA05C"/>
    
    <polyline points="355,45 320,45 295,70"/>
    <circle cx="355" cy="45" r="2.5" fill="#CAA05C"/>
    
    <polyline points="45,205 90,205 115,180"/>
    <circle cx="45" cy="205" r="2.5" fill="#CAA05C"/>
    
    <polyline points="355,205 310,205 285,180"/>
    <circle cx="355" cy="205" r="2.5" fill="#CAA05C"/>
  </g>

  <!-- Centerpiece: HOMAG Precision CNC / Digital Fabrication Spindle -->
  <g transform="translate(200, 105)">
    <!-- Parametric 3D Architectural Facet Workpiece -->
    <polygon points="-80,50 0,90 80,50 0,10" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="1.2" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.06))"/>
    
    <!-- Workpiece Internal Geometric Faceting (Parametric Millwork) -->
    <polygon points="0,10 0,50 -80,50" fill="#F4EFE6" stroke="#CAA05C" stroke-width="0.75"/>
    <polygon points="0,10 80,50 0,50" fill="#EDE4D5" stroke="#CAA05C" stroke-width="0.75"/>
    <polygon points="0,50 80,50 0,90" fill="#E4D7C3" stroke="#CAA05C" stroke-width="0.75"/>
    <polygon points="-80,50 0,50 0,90" fill="#F0E8DC" stroke="#CAA05C" stroke-width="0.75"/>

    <!-- Concentric Toolpath Circles on Workpiece -->
    <ellipse cx="0" cy="50" rx="35" ry="18" fill="none" stroke="#CAA05C" stroke-width="1.2" stroke-dasharray="4,4"/>
    <ellipse cx="0" cy="50" rx="20" ry="10" fill="none" stroke="#1B2A4A" stroke-width="0.8"/>

    <!-- High-Precision Milling Spindle / Laser Head -->
    <!-- Tool Carriage Support -->
    <rect x="-35" y="-85" width="70" height="14" rx="2" fill="url(#navyGrad3)" stroke="#CAA05C" stroke-width="1"/>
    <!-- Linear Motion Rail Guides -->
    <line x1="-55" y1="-78" x2="55" y2="-78" stroke="#CAA05C" stroke-width="1.5"/>
    <circle cx="-55" cy="-78" r="2.5" fill="#CAA05C"/>
    <circle cx="55" cy="-78" r="2.5" fill="#CAA05C"/>

    <!-- Spindle Body -->
    <polygon points="-20,-71 20,-71 14,-35 -14,-35" fill="#24375A" stroke="#CAA05C" stroke-width="0.8"/>
    <!-- Collet Chuck -->
    <rect x="-10" y="-35" width="20" height="12" rx="1.5" fill="url(#goldGrad3)"/>
    <!-- Carbide Micro-Milling Tool / Nozzle -->
    <polygon points="-4,-23 4,-23 0,-5" fill="#1B2A4A"/>

    <!-- Precision Laser Guide Beam -->
    <polygon points="0,-5 -12,50 12,50" fill="url(#laserBeam)"/>
    <line x1="0" y1="-5" x2="0" y2="50" stroke="#DFBA73" stroke-width="1.8"/>

    <!-- Impact Cutting Spark / Laser Focal Point -->
    <circle cx="0" cy="50" r="4" fill="#FFFFFF" stroke="#CAA05C" stroke-width="1.5"/>
    <line x1="-9" y1="50" x2="9" y2="50" stroke="#DFBA73" stroke-width="1.2"/>
    <line x1="0" y1="41" x2="0" y2="59" stroke="#DFBA73" stroke-width="1.2"/>

    <!-- Coordinate HUD Floating Markers -->
    <g transform="translate(58, -30)">
      <rect x="0" y="0" width="58" height="24" rx="4" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="0.8"/>
      <text x="5" y="10" font-family="'Plus Jakarta Sans', monospace" font-size="6.5" font-weight="700" fill="#1B2A4A">X: 1240.5</text>
      <text x="5" y="19" font-family="'Plus Jakarta Sans', monospace" font-size="6.5" font-weight="700" fill="#CAA05C">Z: -0.05</text>
    </g>

    <g transform="translate(-116, -30)">
      <rect x="0" y="0" width="58" height="24" rx="4" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="0.8"/>
      <text x="5" y="10" font-family="'Plus Jakarta Sans', monospace" font-size="6.5" font-weight="700" fill="#1B2A4A">CNC HOMAG</text>
      <text x="5" y="19" font-family="'Plus Jakarta Sans', monospace" font-size="6.5" font-weight="700" fill="#CAA05C">ERP ACTIVE</text>
    </g>
  </g>

  <!-- Technical Spec Footer Pill -->
  <g transform="translate(200, 236)">
    <rect x="-75" y="-10" width="150" height="20" rx="10" fill="#FFFFFF" stroke="#CAA05C" stroke-width="1" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <circle cx="-58" cy="0" r="3" fill="#CAA05C"/>
    <text x="0" y="3.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#1B2A4A" text-anchor="middle" letter-spacing="1.2">CNC &amp; ERP TRACKED</text>
    <circle cx="58" cy="0" r="3" fill="#CAA05C"/>
  </g>
</svg>