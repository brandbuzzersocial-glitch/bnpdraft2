<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="civilBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F4EFE6"/>
      <stop offset="100%" stop-color="#E8DFCE"/>
    </linearGradient>
    <linearGradient id="goldLinearCivil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C785"/>
      <stop offset="50%" stop-color="#CAA05C"/>
      <stop offset="100%" stop-color="#99732B"/>
    </linearGradient>
    <linearGradient id="steelIbeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4354"/>
      <stop offset="50%" stop-color="#242B38"/>
      <stop offset="100%" stop-color="#151A24"/>
    </linearGradient>
    <linearGradient id="copperPipe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5C785"/>
      <stop offset="50%" stop-color="#CAA05C"/>
      <stop offset="100%" stop-color="#8F6A24"/>
    </linearGradient>
    <pattern id="archGridCivil" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CAA05C" stroke-width="0.5" stroke-opacity="0.16"/>
      <circle cx="20" cy="0" r="0.75" fill="#CAA05C" fill-opacity="0.25"/>
    </pattern>
    <filter id="civilDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#151A24" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#civilBgGrad)"/>
  <rect width="600" height="360" fill="url(#archGridCivil)"/>

  <!-- Isometric Construction / Engineering Grid Wireframe -->
  <g opacity="0.35" stroke="#CAA05C" stroke-width="0.75">
    <line x1="300" y1="20" x2="550" y2="160"/>
    <line x1="300" y1="20" x2="50" y2="160"/>
    <line x1="300" y1="160" x2="550" y2="300"/>
    <line x1="300" y1="160" x2="50" y2="300"/>
    <line x1="300" y1="20" x2="300" y2="320"/>
  </g>

  <!-- MEP Ducts & Piping Systems in Ceiling Layer -->
  <g transform="translate(60, 40)" opacity="0.85">
    <!-- Main HVAC Rectangular Duct -->
    <rect x="0" y="20" width="480" height="28" rx="2" fill="#E2DACB" stroke="#CAA05C" stroke-width="1.2"/>
    <!-- Duct Flange Seams -->
    <line x1="80" y1="20" x2="80" y2="48" stroke="#CAA05C" stroke-width="1.5"/>
    <line x1="180" y1="20" x2="180" y2="48" stroke="#CAA05C" stroke-width="1.5"/>
    <line x1="280" y1="20" x2="280" y2="48" stroke="#CAA05C" stroke-width="1.5"/>
    <line x1="380" y1="20" x2="380" y2="48" stroke="#CAA05C" stroke-width="1.5"/>
    
    <!-- Secondary MEP Electrical Cable Tray -->
    <line x1="20" y1="62" x2="460" y2="62" stroke="#242B38" stroke-width="3"/>
    <g stroke="#CAA05C" stroke-width="1">
      <line x1="50" y1="58" x2="50" y2="66"/>
      <line x1="100" y1="58" x2="100" y2="66"/>
      <line x1="150" y1="58" x2="150" y2="66"/>
      <line x1="200" y1="58" x2="200" y2="66"/>
      <line x1="250" y1="58" x2="250" y2="66"/>
      <line x1="300" y1="58" x2="300" y2="66"/>
      <line x1="350" y1="58" x2="350" y2="66"/>
      <line x1="400" y1="58" x2="400" y2="66"/>
    </g>

    <!-- Copper Fire Sprinkler Pipe Run -->
    <path d="M 40,75 L 440,75" stroke="url(#copperPipe)" stroke-width="3.5" fill="none"/>
    <!-- Sprinkler Heads -->
    <circle cx="120" cy="80" r="3" fill="#CAA05C"/>
    <line x1="120" y1="75" x2="120" y2="84" stroke="#CAA05C" stroke-width="1.5"/>
    <circle cx="260" cy="80" r="3" fill="#CAA05C"/>
    <line x1="260" y1="75" x2="260" y2="84" stroke="#CAA05C" stroke-width="1.5"/>
    <circle cx="390" cy="80" r="3" fill="#CAA05C"/>
    <line x1="390" y1="75" x2="390" y2="84" stroke="#CAA05C" stroke-width="1.5"/>
  </g>

  <!-- Structural Civil Engineering Steel Framework (I-Beams & Columns) -->
  <g filter="url(#civilDropShadow)">
    <!-- Heavy Left Structural I-Beam Column -->
    <g transform="translate(130, 110)">
      <polygon points="0,0 40,0 40,180 0,180" fill="url(#steelIbeam)"/>
      <polygon points="8,0 32,0 32,180 8,180" fill="#1C212B"/>
      <!-- Bolted Connection Plates -->
      <circle cx="20" cy="20" r="2.5" fill="url(#goldLinearCivil)"/>
      <circle cx="20" cy="40" r="2.5" fill="url(#goldLinearCivil)"/>
      <circle cx="20" cy="140" r="2.5" fill="url(#goldLinearCivil)"/>
      <circle cx="20" cy="160" r="2.5" fill="url(#goldLinearCivil)"/>
      <line x1="0" y1="0" x2="0" y2="180" stroke="url(#goldLinearCivil)" stroke-width="1.5"/>
    </g>

    <!-- Heavy Right Structural I-Beam Column -->
    <g transform="translate(430, 110)">
      <polygon points="0,0 40,0 40,180 0,180" fill="url(#steelIbeam)"/>
      <polygon points="8,0 32,0 32,180 8,180" fill="#1C212B"/>
      <!-- Bolted Connection Plates -->
      <circle cx="20" cy="20" r="2.5" fill="url(#goldLinearCivil)"/>
      <circle cx="20" cy="40" r="2.5" fill="url(#goldLinearCivil)"/>
      <circle cx="20" cy="140" r="2.5" fill="url(#goldLinearCivil)"/>
      <circle cx="20" cy="160" r="2.5" fill="url(#goldLinearCivil)"/>
      <line x1="40" y1="0" x2="40" y2="180" stroke="url(#goldLinearCivil)" stroke-width="1.5"/>
    </g>

    <!-- Main Horizontal Overhead Girder -->
    <g transform="translate(110, 110)">
      <polygon points="0,0 380,0 380,32 0,32" fill="url(#steelIbeam)"/>
      <line x1="0" y1="0" x2="380" y2="0" stroke="url(#goldLinearCivil)" stroke-width="2"/>
      <line x1="0" y1="32" x2="380" y2="32" stroke="url(#goldLinearCivil)" stroke-width="2"/>
      <!-- Girder Web Gusset Stiffeners -->
      <g stroke="#CAA05C" stroke-width="1.2" opacity="0.7">
        <line x1="80" y1="0" x2="80" y2="32"/>
        <line x1="150" y1="0" x2="150" y2="32"/>
        <line x1="230" y1="0" x2="230" y2="32"/>
        <line x1="300" y1="0" x2="300" y2="32"/>
      </g>
    </g>

    <!-- Center Theodolite / Total Station (Surveying Precision Instrument) -->
    <g transform="translate(265, 175)">
      <!-- Tripod Legs (Telescopic Engineering Aluminium & Gold Trim) -->
      <polygon points="35,35 32,35 6,115 11,115" fill="url(#steelIbeam)"/>
      <polygon points="35,35 38,35 64,115 59,115" fill="url(#steelIbeam)"/>
      <polygon points="34,35 36,35 37,115 33,115" fill="#151A24"/>
      <!-- Tripod Head Mount & Leveling Screws -->
      <polygon points="25,32 45,32 42,37 28,37" fill="url(#goldLinearCivil)"/>
      <circle cx="28" cy="35" r="2" fill="#242B38"/>
      <circle cx="42" cy="35" r="2" fill="#242B38"/>
      
      <!-- Total Station Body -->
      <rect x="26" y="10" width="18" height="22" rx="3" fill="url(#steelIbeam)"/>
      <rect x="29" y="14" width="12" height="10" fill="#E2DACB"/>
      <!-- Optical Scope Barrel -->
      <polygon points="18,17 52,17 52,25 18,25" fill="url(#goldLinearCivil)"/>
      <circle cx="18" cy="21" r="5" fill="#151A24" stroke="url(#goldLinearCivil)" stroke-width="1"/>
      <circle cx="52" cy="21" r="4" fill="#242B38"/>
      <!-- Precision Laser Level Alignment Ray -->
      <line x1="52" y1="21" x2="190" y2="21" stroke="#CAA05C" stroke-width="1.5" stroke-dasharray="4 3"/>
      <circle cx="190" cy="21" r="3" fill="#CAA05C"/>
    </g>

    <!-- Digital Caliper / Ruler Overlay (Civil Accuracy) -->
    <g transform="translate(190, 290)">
      <rect x="0" y="0" width="220" height="18" rx="3" fill="url(#steelIbeam)"/>
      <!-- Ruler Ticks -->
      <g stroke="url(#goldLinearCivil)" stroke-width="1">
        <line x1="20" y1="0" x2="20" y2="8"/>
        <line x1="40" y1="0" x2="40" y2="5"/>
        <line x1="60" y1="0" x2="60" y2="8"/>
        <line x1="80" y1="0" x2="80" y2="5"/>
        <line x1="100" y1="0" x2="100" y2="10"/>
        <line x1="120" y1="0" x2="120" y2="5"/>
        <line x1="140" y1="0" x2="140" y2="8"/>
        <line x1="160" y1="0" x2="160" y2="5"/>
        <line x1="180" y1="0" x2="180" y2="8"/>
        <line x1="200" y1="0" x2="200" y2="10"/>
      </g>
    </g>
  </g>



  <!-- Elegant Gold Border Frame -->
  <rect x="12" y="12" width="576" height="336" fill="none" stroke="#CAA05C" stroke-width="1" opacity="0.35"/>
  <rect x="16" y="16" width="568" height="328" fill="none" stroke="#CAA05C" stroke-width="0.5" opacity="0.2"/>
</svg>